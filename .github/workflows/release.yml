name: Release

# Tag-driven releases. The tag is the single source of truth for the version:
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# Nothing in the repository records the version, so there is no file to forget
# to bump and no way for a file and a tag to disagree. The workflow reads the
# version out of the tag and stamps it into both the assemblies and the MSIX
# manifest at build time.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 0.2.0). Produces artifacts without publishing a release."
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $env:GITHUB_REF -replace '^refs/tags/v', ''
          } else {
            '${{ github.event.inputs.version }}'
          }

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version '$version' is not major.minor.patch"
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building version $version"

      - name: Stamp the MSIX manifest
        shell: pwsh
        run: |
          # MSIX versions are 4-part and the last part must be 0 for Store builds.
          $manifest = 'src/Blare.App/Package.appxmanifest'
          $xml = [xml](Get-Content $manifest)
          $xml.Package.Identity.Version = '${{ steps.version.outputs.version }}.0'
          $xml.Save((Resolve-Path $manifest))

      - name: Test
        run: dotnet test Blare.slnx --configuration Release

      # The app itself cannot be built by the .NET SDK alone: WinUI 3's XAML
      # compiler and the MRT resource tasks ship with Visual Studio, so an SDK
      # build fails inside Microsoft.Build.Packaging.Pri.Tasks. Resolve the real
      # MSBuild once and use it for every step that touches Blare.App.
      - name: Locate MSBuild
        id: msbuild
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $path = & $vswhere -latest -products * `
            -requires Microsoft.Component.MSBuild `
            -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1

          if (-not $path) {
            throw "MSBuild not found on this runner."
          }

          "path=$path" >> $env:GITHUB_OUTPUT
          Write-Host "Using $path"

      - name: Publish (unpackaged, portable)
        shell: pwsh
        run: |
          # PublishDir must be absolute: MSBuild resolves a relative one against
          # the project directory, not the repository root.
          $publishDir = Join-Path $PWD 'artifacts/portable'
          New-Item -ItemType Directory -Force $publishDir | Out-Null

          & "${{ steps.msbuild.outputs.path }}" src/Blare.App/Blare.App.csproj `
            /t:Restore`;Publish `
            /p:Configuration=Release /p:Platform=x64 `
            /p:RuntimeIdentifier=win-x64 /p:SelfContained=true `
            /p:WindowsPackageType=None `
            /p:Version=${{ steps.version.outputs.version }} `
            "/p:PublishDir=$publishDir\" `
            /verbosity:minimal

          if (-not (Get-ChildItem $publishDir -File -ErrorAction SilentlyContinue)) {
            throw "Publish produced no files in $publishDir"
          }

      - name: Package portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/out | Out-Null
          Compress-Archive -Path artifacts/portable/* `
            -DestinationPath "artifacts/out/Blare-${{ steps.version.outputs.version }}-win-x64-portable.zip"

      - name: Build MSIX
        shell: pwsh
        continue-on-error: true
        run: |
          & "${{ steps.msbuild.outputs.path }}" src/Blare.App/Blare.App.csproj `
            /p:Configuration=Release /p:Platform=x64 `
            /p:Version=${{ steps.version.outputs.version }} `
            /p:RuntimeIdentifier=win-x64 /p:SelfContained=true `
            /p:WindowsPackageType=MSIX `
            /p:GenerateAppxPackageOnBuild=true `
            /p:AppxBundle=Never `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxPackageSigningEnabled=false `
            "/p:AppxPackageDir=$(Join-Path $PWD 'artifacts/msix')\"

      - name: Collect MSIX
        shell: pwsh
        run: |
          # Match the app package by name. A plain "newest .msix" search picks up
          # Main.msix and Singleton.msix, which are the Windows App Runtime
          # dependency packages — installing one of those installs the runtime,
          # not Blare, which is exactly what shipped in 0.1.0.
          $msix = Get-ChildItem -Recurse -Filter 'Blare.App_*.msix' artifacts/msix -ErrorAction SilentlyContinue |
            Sort-Object Length -Descending | Select-Object -First 1

          if (-not $msix) {
            Write-Warning "No app MSIX produced; publishing the portable build only."
            exit 0
          }

          Copy-Item $msix.FullName "artifacts/out/Blare-${{ steps.version.outputs.version }}-x64.msix"
          Write-Host "Collected $($msix.Name) ($([math]::Round($msix.Length/1MB,1)) MB)"

      - uses: actions/upload-artifact@v4
        with:
          name: blare-${{ steps.version.outputs.version }}
          path: artifacts/out/*

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Blare ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: artifacts/out/*
