name: Release

# Tag-driven releases. The tag is the single source of truth for the version:
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# Nothing in the repository records the version, so there is no file to forget
# to bump and no way for a file and a tag to disagree. The workflow reads the
# version out of the tag and stamps it into both the assemblies and the MSIX
# manifest at build time.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 0.2.0). Produces artifacts without publishing a release."
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $env:GITHUB_REF -replace '^refs/tags/v', ''
          } else {
            '${{ github.event.inputs.version }}'
          }

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version '$version' is not major.minor.patch"
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building version $version"

      - name: Stamp the MSIX manifest
        shell: pwsh
        run: |
          # MSIX versions are 4-part and the last part must be 0 for Store builds.
          $manifest = 'src/Blare.App/Package.appxmanifest'
          $xml = [xml](Get-Content $manifest)
          $xml.Package.Identity.Version = '${{ steps.version.outputs.version }}.0'
          $xml.Save((Resolve-Path $manifest))

      - name: Test
        run: dotnet test Blare.slnx --configuration Release

      - name: Publish (unpackaged, portable)
        run: >
          dotnet publish src/Blare.App/Blare.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:Platform=x64
          -p:Version=${{ steps.version.outputs.version }}
          -p:WindowsPackageType=None
          --output artifacts/portable

      - name: Package portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/out | Out-Null
          Compress-Archive -Path artifacts/portable/* `
            -DestinationPath "artifacts/out/Blare-${{ steps.version.outputs.version }}-win-x64-portable.zip"

      - name: Build MSIX
        shell: pwsh
        continue-on-error: true
        run: |
          # Resolved through vswhere rather than a hard-coded path: the runner
          # image's Visual Studio edition and version move over time.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products * `
            -requires Microsoft.Component.MSBuild `
            -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1

          if (-not $msbuild) {
            Write-Warning "MSBuild not found on this runner; skipping the MSIX."
            exit 0
          }

          & $msbuild src/Blare.App/Blare.App.csproj `
            /p:Configuration=Release /p:Platform=x64 `
            /p:Version=${{ steps.version.outputs.version }} `
            /p:WindowsPackageType=MSIX `
            /p:GenerateAppxPackageOnBuild=true `
            /p:AppxBundle=Never `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxPackageSigningEnabled=false

      - name: Collect MSIX
        shell: pwsh
        run: |
          $msix = Get-ChildItem -Recurse -Filter *.msix src/Blare.App/obj |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($msix) {
            Copy-Item $msix.FullName "artifacts/out/Blare-${{ steps.version.outputs.version }}-x64.msix"
          } else {
            Write-Warning "No MSIX produced; publishing the portable build only."
          }

      - uses: actions/upload-artifact@v4
        with:
          name: blare-${{ steps.version.outputs.version }}
          path: artifacts/out/*

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Blare ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: artifacts/out/*
